name: Deploy Morpha Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed by peaceiris/actions-gh-pages to push to gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build common packages
        run: |
          npm run build -w @morpha/core
          npm run build -w @morpha/web-runtime

      - name: Generate static site
        working-directory: apps/editor
        env:
          NUXT_APP_BASE_URL: /morpha/
        run: npm run generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/editor/.output/public
          # Preserve CNAME / other files already on gh-pages branch
          keep_files: false
          # Disable Jekyll so files starting with _ are served correctly
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
